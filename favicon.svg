<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Bartlog mark: a thermal ("Bart") as three widening rings, rising off a ridge and drifting with
       the wind, the way the app draws thermal funnels. Colours from the app tokens. -->
  <rect width="64" height="64" rx="14" fill="#1b2421" />
  <!-- ridge -->
  <path d="M0 54 L14 44 L23 49 L36 38 L50 47 L64 41 V64 H0 Z" fill="#2f4a3f" />
  <path d="M0 54 L14 44 L23 49 L36 38 L50 47 L64 41" fill="none" stroke="#aab4ab" stroke-width="2.4" stroke-linejoin="round" />
  <!-- thermal rings -->
  <g fill="none" stroke="#f0c24b" stroke-width="3.8">
    <ellipse cx="31" cy="34" rx="6.5" ry="2.6" />
    <ellipse cx="34.5" cy="25" rx="11" ry="3.6" />
    <ellipse cx="39" cy="14.5" rx="15.5" ry="4.6" stroke-width="4.2" />
  </g>
</svg>
